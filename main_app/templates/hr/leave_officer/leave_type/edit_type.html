<!-- ===================================================== -->
<!-- EDIT MODAL -->
<!-- ===================================================== -->

<div id="editModal"
     class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">

  <div class="bg-gray-800 p-6 rounded-2xl w-full max-w-md space-y-4">

    <h2 class="text-xl font-semibold text-yellow-400">Edit Leave Type</h2>

    <form method="POST" id="editForm" class="space-y-4">

      <!-- Leave Type Name -->
      <input name="name" id="editName"
             class="w-full bg-gray-700 text-white px-3 py-2 rounded-lg"
             placeholder="Leave Type Name"
             required>

      <!-- Description -->
      <textarea name="description" id="editDescription"
                class="w-full bg-gray-700 text-white px-3 py-2 rounded-lg"
                placeholder="Description"></textarea>

      <!-- Max Paid Days -->
      <input name="max_paid_days" id="editMaxPaidDays"
             type="number"
             min="0"
             placeholder="Max Paid Days (e.g., 105 for maternity leave)"
             class="w-full bg-gray-700 text-white px-3 py-2 rounded-lg">

      <!-- Max Duration Days -->
      <input name="max_duration_days" id="editMaxDurationDays"
             type="number"
             min="0"
             placeholder="Max Duration Days (e.g., 180 for study leave)"
             class="w-full bg-gray-700 text-white px-3 py-2 rounded-lg">

      <!-- Buttons -->
      <div class="flex justify-end gap-3">

        <button type="button" onclick="closeEditModal()"
                class="bg-gray-600 px-4 py-2 rounded-lg">
          Cancel
        </button>

        <button type="submit"
                class="bg-yellow-500 hover:bg-yellow-600 px-4 py-2 rounded-lg text-black">
          Update
        </button>

      </div>

    </form>
  </div>
</div>

<!-- ===================================================== -->
<!-- JavaScript: Open Edit Modal with pre-filled values -->
<!-- ===================================================== -->
<script>
function openEditModal(id, name, description, maxPaidDays = '', maxDurationDays = '') {

    document.getElementById("editName").value = name;
    document.getElementById("editDescription").value = description;
    document.getElementById("editMaxPaidDays").value = maxPaidDays;
    document.getElementById("editMaxDurationDays").value = maxDurationDays;

    let actionUrl = "{{ url_for('leave_officer_bp.edit_leave_type', id=0) }}";
    actionUrl = actionUrl.replace("0", id);

    document.getElementById("editForm").action = actionUrl;

    const modal = document.getElementById("editModal");
    modal.classList.remove("hidden");
    modal.classList.add("flex");
}

function closeEditModal() {
    document.getElementById("editModal").classList.add("hidden");
}
</script>
