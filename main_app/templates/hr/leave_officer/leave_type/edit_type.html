<!-- ===================================================== -->
<!-- EDIT MODAL -->
<!-- ===================================================== -->

<div id="editModal"
     class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50">

  <div class="bg-slate-800/90 backdrop-blur-md p-6 rounded-2xl w-full max-w-md space-y-5 border border-slate-700 shadow-xl animate-fadeIn">

    <!-- HEADER -->
    <div class="flex items-center gap-3">
      <div class="p-2 bg-blue-500/20 rounded-lg">
        <i class="fa-solid fa-pen-to-square text-blue-400"></i>
      </div>
      <h2 class="text-xl font-semibold text-white">Edit Leave Type</h2>
    </div>

    <form method="POST" id="editForm" class="space-y-4">

      <!-- Leave Type Name -->
      <div class="relative">
        <i class="fa-solid fa-tag absolute left-3 top-3 text-gray-400"></i>
        <input name="name" id="editName"
               required
               placeholder="Leave Type Name"
               class="w-full pl-10 bg-slate-700 text-white px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Description -->
      <div class="relative">
        <i class="fa-solid fa-align-left absolute left-3 top-3 text-gray-400"></i>
        <textarea name="description" id="editDescription"
                  placeholder="Description"
                  class="w-full pl-10 bg-slate-700 text-white px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <!-- Max Paid Days -->
      <div class="relative">
        <i class="fa-solid fa-money-bill-wave absolute left-3 top-3 text-gray-400"></i>
        <input name="max_paid_days" id="editMaxPaidDays"
               type="number"
               min="0"
               placeholder="Max Paid Days (e.g., 105)"
               class="w-full pl-10 bg-slate-700 text-white px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>

      <!-- Max Duration Days -->
      <div class="relative">
        <i class="fa-solid fa-calendar-days absolute left-3 top-3 text-gray-400"></i>
        <input name="max_duration_days" id="editMaxDurationDays"
               type="number"
               min="0"
               placeholder="Max Duration Days (e.g., 180)"
               class="w-full pl-10 bg-slate-700 text-white px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:ring-2 focus:ring-purple-500">
      </div>

      <!-- Buttons -->
      <div class="flex justify-end gap-3 pt-2">

        <button type="button"
                onclick="closeEditModal()"
                class="px-4 py-2 rounded-lg bg-slate-600 hover:bg-slate-500 text-gray-200 transition">
          <i class="fa-solid fa-xmark mr-1"></i> Cancel
        </button>

        <button type="submit"
                class="px-4 py-2 rounded-lg bg-blue-500 hover:bg-blue-600 text-white shadow-md hover:shadow-blue-500/20 transition">
          <i class="fa-solid fa-pen mr-1"></i> Update
        </button>

      </div>

    </form>
  </div>
</div>

<!-- ===================================================== -->
<!-- JavaScript -->
<!-- ===================================================== -->
<script>
function openEditModal(id, name, description, maxPaidDays = '', maxDurationDays = '') {

    document.getElementById("editName").value = name;
    document.getElementById("editDescription").value = description;
    document.getElementById("editMaxPaidDays").value = maxPaidDays;
    document.getElementById("editMaxDurationDays").value = maxDurationDays;

    let actionUrl = "{{ url_for('leave_officer_bp.edit_leave_type', id=0) }}";
    actionUrl = actionUrl.replace("0", id);

    document.getElementById("editForm").action = actionUrl;

    const modal = document.getElementById("editModal");
    modal.classList.remove("hidden");
    modal.classList.add("flex");
}

function closeEditModal() {
    document.getElementById("editModal").classList.add("hidden");
}
</script>

<!-- Animation -->
<style>
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
.animate-fadeIn {
  animation: fadeIn 0.2s ease-out;
}
</style>
