<!-- Edit Position Modal (Partial) -->
<div id="editPositionModal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onclick="closeEditModal()"></div>
  
  <!-- Modal Panel -->
  <div class="relative min-h-screen flex items-center justify-center p-4">
    <div class="relative w-full max-w-2xl bg-[#1e293b] border border-blue-900/40 rounded-2xl shadow-2xl transform transition-all">
      <!-- Header -->
      <div class="flex items-center justify-between p-6 border-b border-gray-700/50">
        <h3 id="modal-title" class="text-xl font-semibold text-white flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-blue-400"></i>
          Edit Position
        </h3>
        <button type="button" onclick="closeEditModal()" class="text-gray-400 hover:text-white transition p-2 rounded-lg hover:bg-gray-700/50" aria-label="Close modal">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      
      <!-- Form -->
      <form id="modalEditForm" class="p-6 space-y-5">
        <input type="hidden" id="modalPositionId" name="position_id">
        
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Position Name <span class="text-red-400">*</span></label>
          <input type="text" id="modalPositionName" name="name" required
                 class="w-full px-4 py-3 bg-[#0f172a] border border-gray-700 rounded-xl text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Description</label>
          <textarea id="modalPositionDescription" name="description" rows="4"
                    class="w-full px-4 py-3 bg-[#0f172a] border border-gray-700 rounded-xl text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition resize-none"></textarea>
        </div>
        
        <!-- Actions -->
        <div class="flex flex-wrap gap-3 pt-2">
          <button type="submit" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-2.5 rounded-xl shadow-md hover:shadow-blue-500/30 transition">
            <i class="fa-solid fa-rotate-right"></i> Save Changes
          </button>
          <button type="button" onclick="closeEditModal()" class="inline-flex items-center gap-2 bg-gray-700 hover:bg-gray-600 text-white font-medium px-6 py-2.5 rounded-xl transition">
            <i class="fa-solid fa-xmark"></i> Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
