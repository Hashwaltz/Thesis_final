{# templates/hr/admin/position/_add_position_modal.html #}

<div id="addPositionModal" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true">
  <div class="fixed inset-0 bg-black/60 backdrop-blur-sm" onclick="closeAddPositionModal()"></div>
  <div class="fixed inset-0 flex items-center justify-center p-4">
    <div class="relative bg-gray-800 rounded-2xl shadow-2xl border border-gray-700/50 w-full max-w-2xl max-h-[90vh] overflow-y-auto">
      
      <form id="addPositionForm" method="POST" action="{{ url_for('hr_admin_bp.add_position') }}" class="p-6 space-y-5">
        <!-- 🔑 CSRF TOKEN -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">
        
        <div class="flex items-center justify-between mb-2 pb-4 border-b border-gray-700/50">
          <h3 class="text-lg font-semibold text-white flex items-center gap-2">
            <i class="fa-solid fa-plus-circle text-blue-400"></i>
            Add New Position
          </h3>
          <button type="button" onclick="closeAddPositionModal()" class="p-2 text-gray-400 hover:text-white rounded-lg transition-colors" aria-label="Close modal">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        
        <!-- Position Name -->
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Position Name <span class="text-red-400">*</span></label>
          <input type="text" name="name" id="addPositionName" 
                 class="w-full px-4 py-3 bg-gray-900/50 border border-gray-700 rounded-xl text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all"
                 placeholder="e.g., Senior Software Engineer, HR Manager" required minlength="3" maxlength="100">
          <p class="text-xs text-gray-500 mt-1">Use clear, industry-standard job titles</p>
          <p class="error-msg text-red-400 text-sm mt-1 hidden"></p>
        </div>
        
        <!-- Description -->
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Description <span class="text-gray-500 font-normal">(Optional)</span></label>
          <textarea name="description" id="addPositionDescription" rows="4" maxlength="500"
                    class="w-full px-4 py-3 bg-gray-900/50 border border-gray-700 rounded-xl text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all resize-none"
                    placeholder="Briefly describe the role's purpose, key responsibilities, and expectations..."></textarea>
          <div class="flex justify-end mt-1">
            <p class="text-xs text-gray-500"><span id="addDescCounter">0</span>/500</p>
          </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="flex justify-end gap-3 pt-4 border-t border-gray-700/50">
          <button type="button" onclick="closeAddPositionModal()"
                  class="px-4 py-2.5 bg-gray-700 hover:bg-gray-600 text-gray-200 rounded-xl text-sm font-medium transition-all">
            Cancel
          </button>
          <button type="submit" id="addPositionSubmitBtn"
                  class="px-4 py-2.5 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white rounded-xl text-sm font-medium transition-all shadow-lg hover:shadow-blue-500/25 flex items-center gap-2">
            <i class="fa-solid fa-check"></i>
            <span id="addPositionSubmitText">Create Position</span>
            <i class="fa-solid fa-spinner fa-spin hidden" id="addPositionSpinner"></i>
          </button>
        </div>
      </form>
      
    </div>
  </div>
</div>

<script>
// Add Position Modal Functions
window.openAddPositionModal = function() {
  document.getElementById('addPositionForm')?.reset();
  document.getElementById('addPositionName').value = '';
  document.getElementById('addPositionDescription').value = '';
  document.getElementById('addDescCounter').textContent = '0';
  document.querySelectorAll('#addPositionForm .error-msg').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('#addPositionForm input, #addPositionForm textarea').forEach(el => {
    el.classList.remove('invalid', 'valid');
  });
  
  const modal = document.getElementById('addPositionModal');
  modal.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  document.getElementById('addPositionName')?.focus();
};

window.closeAddPositionModal = function() {
  const modal = document.getElementById('addPositionModal');
  modal.classList.add('hidden');
  document.body.style.overflow = '';
  document.getElementById('addPositionForm')?.reset();
};

// Character counter
document.addEventListener('DOMContentLoaded', function() {
  const descInput = document.getElementById('addPositionDescription');
  const descCounter = document.getElementById('addDescCounter');
  descInput?.addEventListener('input', function() {
    descCounter.textContent = this.value.length;
  });
  
  // Validation
  const nameInput = document.getElementById('addPositionName');
  nameInput?.addEventListener('blur', validateAddPositionName);
});

function validateAddPositionName() {
  const input = document.getElementById('addPositionName');
  const value = input?.value.trim();
  const errorEl = input?.closest('div')?.querySelector('.error-msg');
  let error = null;
  
  if (!value) error = "Position name is required";
  else if (value.length < 3) error = "Minimum 3 characters required";
  else if (!/^[A-Za-z0-9\s\-\&\.,']+$/.test(value)) error = "Please enter a valid format";
  
  if (error) {
    input?.classList.add('invalid');
    input?.classList.remove('valid');
    if (errorEl) { errorEl.textContent = error; errorEl.classList.remove('hidden'); }
    return false;
  } else {
    input?.classList.remove('invalid');
    input?.classList.add('valid');
    if (errorEl) errorEl.classList.add('hidden');
    return true;
  }
}

// Submit handler with loading state
document.getElementById('addPositionForm')?.addEventListener('submit', function(e) {
  if (!validateAddPositionName()) {
    e.preventDefault();
    document.getElementById('addPositionName')?.focus();
    return;
  }
  const submitBtn = document.getElementById('addPositionSubmitBtn');
  const submitText = document.getElementById('addPositionSubmitText');
  const spinner = document.getElementById('addPositionSpinner');
  submitBtn.disabled = true;
  submitText.textContent = "Creating...";
  spinner?.classList.remove('hidden');
});
</script>
