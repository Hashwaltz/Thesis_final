<div id="addAttendanceModal"
     class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50">

  <div class="bg-gray-900 rounded-2xl w-full max-w-2xl p-6 relative border border-gray-700 shadow-xl">

    <!-- Close Button -->
    <button type="button"
            id="closeAddAttendanceModal"
            class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <!-- Header -->
    <h2 class="text-2xl font-semibold text-blue-400 mb-6 text-center flex items-center justify-center gap-2">
      <i class="fa-solid fa-user-plus"></i>
      Add Manual Attendance
    </h2>

    <form action="{{ url_for('hr_admin_bp.add_manual_attendance') }}"
          method="POST"
          class="space-y-5">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

        <!-- Employee -->
        <div>
          <label class="block text-gray-400 mb-1">
            <i class="fa-solid fa-user mr-1"></i> Employee
          </label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <select name="employee_id"
                    required
                    class="w-full pl-10 pr-3 py-2 rounded-lg bg-gray-700 text-gray-200 focus:ring-2 focus:ring-blue-500">
              <option value="">Select Employee</option>
              {% for emp in employees %}
                <option value="{{ emp.id }}">
                  {{ emp.get_full_name() }}
                </option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- Date -->
        <div>
          <label class="block text-gray-400 mb-1">
            <i class="fa-regular fa-calendar mr-1"></i> Date
          </label>
          <div class="relative">
            <i class="fa-regular fa-calendar absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="date"
                   name="date"
                   required
                   class="w-full pl-10 pr-3 py-2 rounded-lg bg-gray-700 text-gray-200 focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <!-- Time In -->
        <div>
          <label class="block text-gray-400 mb-1">
            <i class="fa-solid fa-right-to-bracket mr-1"></i> Time In
          </label>
          <div class="relative">
            <i class="fa-solid fa-right-to-bracket absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="time"
                   name="time_in"
                   class="w-full pl-10 pr-3 py-2 rounded-lg bg-gray-700 text-gray-200 focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <!-- Time Out -->
        <div>
          <label class="block text-gray-400 mb-1">
            <i class="fa-solid fa-right-from-bracket mr-1"></i> Time Out
          </label>
          <div class="relative">
            <i class="fa-solid fa-right-from-bracket absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="time"
                   name="time_out"
                   class="w-full pl-10 pr-3 py-2 rounded-lg bg-gray-700 text-gray-200 focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <!-- Status -->
        <div>
          <label class="block text-gray-400 mb-1">
            <i class="fa-solid fa-circle-info mr-1"></i> Status
          </label>
          <div class="relative">
            <i class="fa-solid fa-circle-info absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <select name="status"
                    class="w-full pl-10 pr-3 py-2 rounded-lg bg-gray-700 text-gray-200 focus:ring-2 focus:ring-blue-500">
              <option value="Present">Present</option>
              <option value="Late">Late</option>
              <option value="Absent">Absent</option>
            </select>
          </div>
        </div>

        <!-- Remarks -->
        <div class="md:col-span-2">
          <label class="block text-gray-400 mb-1">
            <i class="fa-regular fa-note-sticky mr-1"></i> Remarks
          </label>
          <textarea name="remarks"
                    class="w-full px-3 py-2 rounded-lg bg-gray-700 text-gray-200 focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

      </div>

      <!-- Buttons -->
      <div class="flex justify-end gap-3 mt-6">

        <button type="button"
                id="cancelAddAttendance"
                class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-xl flex items-center gap-2">
          <i class="fa-solid fa-ban"></i> Cancel
        </button>

        <button type="submit"
                class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl flex items-center gap-2 shadow-md">
          <i class="fa-solid fa-floppy-disk"></i> Save Attendance
        </button>

      </div>

    </form>

  </div>
</div>
