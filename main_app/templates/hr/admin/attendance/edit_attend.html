<div id="editAttendanceModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
  <div class="bg-gray-900 rounded-2xl w-full max-w-2xl p-6 relative">

    <!-- Close button -->
    <button id="closeEditAttendanceModal" class="absolute top-4 right-4 text-gray-400 hover:text-white">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <h2 class="text-2xl font-semibold text-blue-400 mb-4 text-center">
      <i class="fa-solid fa-pen-to-square mr-2"></i> Edit Attendance
    </h2>

    <form id="editAttendanceForm" method="POST" class="space-y-4">
      <input type="hidden" name="attendance_id" id="attendance_id">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <!-- Date -->
        <div>
          <label class="block text-gray-400 mb-1">
            <i class="fa-regular fa-calendar mr-1"></i> Date
          </label>
          <input type="date" name="date" id="date"
                 class="w-full px-3 py-2 rounded-lg bg-gray-700 text-gray-200 focus:ring-2 focus:ring-blue-500"
                 required>
        </div>

        <!-- Time In -->
        <div>
          <label class="block text-gray-400 mb-1">
            <i class="fa-solid fa-right-to-bracket mr-1"></i> Time In
          </label>
          <input type="time" name="time_in" id="time_in"
                 class="w-full px-3 py-2 rounded-lg bg-gray-700 text-gray-200 focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Time Out -->
        <div>
          <label class="block text-gray-400 mb-1">
            <i class="fa-solid fa-right-from-bracket mr-1"></i> Time Out
          </label>
          <input type="time" name="time_out" id="time_out"
                 class="w-full px-3 py-2 rounded-lg bg-gray-700 text-gray-200 focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Status -->
        <div>
          <label class="block text-gray-400 mb-1">
            <i class="fa-solid fa-circle-info mr-1"></i> Status
          </label>
          <select name="modal_status" id="modal_status"
                  class="w-full px-3 py-2 rounded-lg bg-gray-700 text-gray-200 focus:ring-2 focus:ring-blue-500">
            <option value="Present">Present</option>
            <option value="Late">Late</option>
            <option value="Absent">Absent</option>
            <option value="Leave">Leave</option>
          </select>
        </div>

        <!-- Remarks -->
        <div class="md:col-span-2">
          <label class="block text-gray-400 mb-1">
            <i class="fa-regular fa-note-sticky mr-1"></i> Remarks
          </label>
          <textarea name="remarks" id="remarks"
                    class="w-full px-3 py-2 rounded-lg bg-gray-700 text-gray-200 focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

      </div>

      <div class="flex justify-end gap-2 mt-4">
        <button type="button" id="cancelEditAttendance"
                class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-xl">
          <i class="fa-solid fa-ban mr-1"></i> Cancel
        </button>

        <button type="submit"
                class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl">
          <i class="fa-solid fa-floppy-disk mr-1"></i> Save Changes
        </button>
      </div>

    </form>
  </div>
</div>
