{% extends "hr/admin/admin_base.html" %}
{% block title %}Import Attendance | HR Admin{% endblock %}

{% block content %}

<main class="p-6 space-y-6 max-w-3xl mx-auto">

  <!-- Card Container -->
  <div class="bg-slate-800 rounded-2xl shadow-lg border border-slate-700 p-6">
    
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-semibold text-blue-400">Import Attendance</h2>
      <i class="fas fa-file-excel text-green-400 text-2xl"></i>
    </div>

    <!-- Upload Form -->
    <form method="POST" enctype="multipart/form-data" class="space-y-4">
      
      <div class="flex flex-col gap-2">
        <label class="text-gray-300 font-medium" for="file">Upload Attendance Excel File</label>
        <input 
          type="file" 
          name="file" 
          id="file"
          accept=".xlsx,.xls" 
          required
          class="bg-slate-700 text-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 border border-slate-600"
        >
      </div>

      <button type="submit" 
              class="bg-blue-500 hover:bg-blue-600 text-white w-full py-3 rounded-xl flex items-center justify-center gap-2 transition">
        <i class="fas fa-upload"></i> Upload & Parse
      </button>

    </form>

  </div>

</main>

{% endblock %}
