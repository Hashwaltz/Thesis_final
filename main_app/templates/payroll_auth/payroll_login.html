{% extends "payroll_auth/payroll_base.html" %}

{% block title %}Login | Payroll System{% endblock %}

{% block content %}
<!-- Background Section -->
<div class="relative w-full h-screen flex items-center justify-center bg-cover bg-center"
     style="background-image: url('{{ url_for('static', filename='img/muni.jpg') }}');">

  <!-- Enhanced Blur Overlay - Deeper Green -->
  <div class="absolute inset-0 bg-gradient-to-br from-green-950/90 via-green-900/85 to-emerald-950/90 backdrop-blur-md"></div>

  <!-- Login Card - Richer Green Accents -->
  <div class="relative z-10 bg-white/95 dark:bg-gray-900/95 shadow-2xl shadow-green-900/30 rounded-2xl p-8 w-full max-w-md border border-green-700/50 dark:border-green-600/50">
    
    <!-- Logo & Header -->
    <div class="text-center mb-6">
      <img src="{{ url_for('static', filename='img/logo2.png') }}" 
           alt="Logo" 
           class="w-24 h-24 mx-auto rounded-full mb-3 shadow-lg shadow-green-700/40 border-2 border-green-600 dark:border-green-500">

      <h2 class="text-2xl font-bold bg-gradient-to-r from-green-700 to-emerald-600 dark:from-green-400 dark:to-emerald-300 bg-clip-text text-transparent">
        Welcome Back
      </h2>

      <p class="text-gray-700 dark:text-gray-300 text-sm mt-1 font-medium">
        Sign in to continue to your dashboard
      </p>
    </div>

    <!-- Login Form -->
    <form method="POST" action="{{ url_for('payroll_auth_bp.login') }}" class="space-y-5">

      <!-- Email -->
      <div>
        <label class="block text-sm font-semibold text-gray-800 dark:text-gray-200 mb-2">
          Email Address
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-green-600 dark:text-green-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9v-1a2 2 0 012-2h2a2 2 0 012 2v1" />
            </svg>
          </span>
          <input
            type="email"
            name="email"
            required
            autocomplete="email"
            class="w-full bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 
                  border border-green-300/60 dark:border-green-700/60 rounded-lg pl-10 pr-3 py-2.5 
                  focus:ring-2 focus:ring-green-600 focus:border-green-600 
                  outline-none transition-all duration-200 hover:border-green-400 dark:hover:border-green-500"
            placeholder="you@example.com">
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-semibold text-gray-800 dark:text-gray-200 mb-2">
          Password
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-green-600 dark:text-green-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </span>
          <input
            type="password"
            name="password"
            id="password"
            required
            autocomplete="current-password"
            class="w-full bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 
                  border border-green-300/60 dark:border-green-700/60 rounded-lg pl-10 pr-3 py-2.5 
                  focus:ring-2 focus:ring-green-600 focus:border-green-600 
                  outline-none transition-all duration-200 hover:border-green-400 dark:hover:border-green-500"
            placeholder="••••••••">
        </div>
      </div>

      <!-- Options Row -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center text-gray-700 dark:text-gray-300 cursor-pointer hover:text-green-700 dark:hover:text-green-400 transition-colors">
          <input type="checkbox" id="showPassword" class="mr-2 h-4 w-4 text-green-600 border-green-400 rounded focus:ring-green-500">
          Show Password
        </label>
      </div>

      <!-- Submit Button - Enhanced Gradient -->
      <button type="submit"
              class="w-full bg-gradient-to-r from-green-700 to-emerald-700 hover:from-green-800 hover:to-emerald-800 
                     text-white font-semibold py-2.5 rounded-lg shadow-lg shadow-green-700/40 
                     hover:shadow-xl hover:shadow-green-800/50 transform hover:-translate-y-0.5
                     transition-all duration-200 focus:ring-4 focus:ring-green-500/50">
        Sign In Securely
      </button>

    </form>

    <!-- Footer -->
    <div class="mt-6 text-center">
      <p class="text-xs text-gray-500 dark:text-gray-400">
         Secure Payroll Access • Encrypted Connection
      </p>
    </div>

  </div>
</div>

<!-- SweetAlert -->
<script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {

  const passwordInput = document.getElementById('password');
  const showPasswordCheckbox = document.getElementById('showPassword');

  showPasswordCheckbox.addEventListener('change', () => {
    passwordInput.type = showPasswordCheckbox.checked ? 'text' : 'password';
  });

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      {% if category == 'error' %}
        Swal.fire({
          icon: 'error',
          title: 'Login Failed',
          text: '{{ msg }}',
          background: '#1a2e24',
          color: '#fff',
          confirmButtonColor: '#166534',
          timer: 2500,
          showConfirmButton: false
        });
      {% elif category == 'success' %}
        Swal.fire({
          icon: 'success',
          title: 'Success',
          text: '{{ msg }}',
          background: '#1a2e24',
          color: '#fff',
          confirmButtonColor: '#166534',
          timer: 2000,
          showConfirmButton: false
        });
      {% endif %}
    {% endfor %}
  {% endwith %}

});
</script>

{% endblock %}
