{% extends 'payroll/staff/staff_base.html' %}

{% block title %}Part-Timer Payroll Periods{% endblock %}

{% block content %}
<section class="p-6 space-y-6 text-gray-200">
  <h2 class="text-2xl font-semibold text-emerald-400 mb-4">Select Payroll Period</h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for period in periods %}
    <a href="{{ url_for('payroll_staff_bp.preview_parttimer_payroll', period_id=period.id) }}"
       class="block p-6 bg-gray-800 rounded-2xl border border-gray-700 hover:border-emerald-400 transition">
      <h3 class="text-lg font-semibold text-emerald-400">
        {{ period.start_date }} - {{ period.end_date }}
      </h3>
      <p class="text-gray-400 text-sm">Status: {{ period.status }}</p>
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
