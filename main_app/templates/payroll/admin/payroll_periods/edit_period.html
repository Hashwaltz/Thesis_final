{% extends 'payroll/admin/payroll_admin_base.html' %}
{% block title %}Payroll Admin - Edit Payroll Period{% endblock %}

{% block content %}

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<div class="min-h-screen p-6 flex justify-center">

<div class="w-full max-w-4xl">

<!-- CARD -->
<div class="bg-gray-900/80 backdrop-blur-xl border border-gray-800 rounded-2xl shadow-2xl overflow-hidden">

<!-- HEADER -->
<div class="p-6 border-b border-gray-800 space-y-2">

<h1 class="text-2xl font-bold text-emerald-400 tracking-wide">
Edit Payroll Period
</h1>

<p class="text-sm text-gray-400">
Modify payroll cycle information
</p>

<div class="h-1 w-24 bg-emerald-600 rounded"></div>

</div>

<!-- FORM -->
<form method="POST"
      action="{{ url_for('payroll_admin_bp.edit_payroll_period', period_id=payroll_period.id) }}"
      id="payrollForm"
      class="p-6 space-y-6">

<!-- Period Name -->
<div class="space-y-2">
<label class="text-sm text-gray-300 font-medium">
Payroll Period Name
</label>

<input type="text"
       name="period_name"
       value="{{ payroll_period.period_name }}"
       required
       placeholder="Example: October 1 – 15, 2025"
       class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-gray-800
              text-gray-100 placeholder-gray-600
              focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 outline-none transition">
</div>

<!-- Date Grid -->
<div class="grid md:grid-cols-3 gap-5">

<div class="space-y-2">
<label class="text-sm text-gray-300">Start Date</label>
<input type="date"
       name="start_date"
       value="{{ payroll_period.start_date.strftime('%Y-%m-%d') }}"
       required
       class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-gray-800
              text-gray-100 focus:ring-2 focus:ring-emerald-600 outline-none transition">
</div>

<div class="space-y-2">
<label class="text-sm text-gray-300">End Date</label>
<input type="date"
       name="end_date"
       value="{{ payroll_period.end_date.strftime('%Y-%m-%d') }}"
       required
       class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-gray-800
              text-gray-100 focus:ring-2 focus:ring-emerald-600 outline-none transition">
</div>

<div class="space-y-2">
<label class="text-sm text-gray-300">Pay Date</label>
<input type="date"
       name="pay_date"
       value="{{ payroll_period.pay_date.strftime('%Y-%m-%d') }}"
       required
       class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-gray-800
              text-gray-100 focus:ring-2 focus:ring-emerald-600 outline-none transition">
</div>

</div>

<!-- STATUS -->
<div class="space-y-2">
<label class="text-sm text-gray-300">Status</label>

<select name="status"
        class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-gray-800
               text-gray-100 focus:ring-2 focus:ring-emerald-600 outline-none transition">

<option value="Open" {% if payroll_period.status == 'Open' %}selected{% endif %}>
Open
</option>

<option value="Processing" {% if payroll_period.status == 'Processing' %}selected{% endif %}>
Processing
</option>

<option value="Closed" {% if payroll_period.status == 'Closed' %}selected{% endif %}>
Closed
</option>

</select>
</div>

<!-- ACTIONS -->
<div class="flex flex-col sm:flex-row gap-4 pt-4">

<button type="button"
        id="savePayrollBtn"
        class="flex-1 py-3 rounded-xl font-semibold
               bg-emerald-600 hover:bg-emerald-500
               text-white transition shadow-lg hover:shadow-emerald-500/30">

Update Payroll Period
</button>

<a href="{{ url_for('payroll_admin_bp.view_payroll_periods') }}"
   class="flex-1 text-center py-3 rounded-xl border border-gray-800
          hover:bg-gray-800 text-gray-300 transition">

Cancel

</a>

</div>

</form>

</div>

</div>
</div>

<!-- SWEET ALERT CONFIRMATION -->
<script>

const form = document.getElementById("payrollForm");
const saveBtn = document.getElementById("savePayrollBtn");

saveBtn.addEventListener("click", function(e){
e.preventDefault();

Swal.fire({
title: "Confirm Update",
text: "Are you sure you want to update this payroll period?",
icon: "question",
showCancelButton: true,
confirmButtonColor: "#10b981",
cancelButtonColor: "#ef4444",
confirmButtonText: "Yes, update it"
}).then((result)=>{
if(result.isConfirmed){
form.submit();
}
});

});

</script>

{% endblock %}
