{% extends 'payroll/admin/payroll_admin_base.html' %}
{% block title %}Edit Loan{% endblock %}

{% block content %}
<section class="p-6 text-gray-200">

  <!-- ===== HEADER ===== -->
  <div class="mb-6 flex items-center justify-between">
    <h1 class="text-2xl font-semibold text-blue-400 flex items-center gap-3">
      <i class="fa-solid fa-pen-to-square text-3xl"></i>
      Edit Loan
    </h1>

    <a href="{{ url_for('payroll_admin_bp.loans') }}"
       class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg">
      ← Back to Loans
    </a>
  </div>

  <!-- ===== FORM ===== -->
  <div class="flex justify-center">
    <form method="POST"
          class="w-full max-w-2xl bg-gray-800 p-6 rounded-2xl border border-gray-700 space-y-5">

      <!-- Employee -->
      <div>
        <label class="block mb-1 text-sm text-gray-400">Employee</label>
        <input type="text"
               value="{{ loan.employee.full_name if loan.employee else 'N/A' }}"
               disabled
               class="w-full px-4 py-2 bg-gray-700 rounded-lg text-gray-300">
      </div>

      <!-- Provider -->
      <div>
        <label class="block mb-1 text-sm text-gray-400">Provider</label>
        <input type="text" name="provider"
               value="{{ loan.provider }}"
               required
               class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Loan Type -->
      <div>
        <label class="block mb-1 text-sm text-gray-400">Loan Type</label>
        <input type="text" name="loan_type"
               value="{{ loan.loan_type }}"
               required
               class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Total Amount -->
      <div>
        <label class="block mb-1 text-sm text-gray-400">Total Amount</label>
        <input type="number" step="0.01" name="total_amount"
               value="{{ loan.total_amount }}"
               required
               class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500"
               id="total_amount">
      </div>

      <!-- Monthly Payment -->
      <div>
        <label class="block mb-1 text-sm text-gray-400">Monthly Payment</label>
        <input type="number" step="0.01" name="monthly_payment"
               value="{{ loan.monthly_payment }}"
               required
               class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500"
               id="monthly_payment">
      </div>

      <!-- Remaining Balance (Read Only) -->
      <div>
        <label class="block mb-1 text-sm text-gray-400">Remaining Balance</label>
        <input type="text"
               value="₱{{ '{:,.2f}'.format(loan.remaining_balance) }}"
               disabled
               class="w-full px-4 py-2 bg-gray-700 rounded-lg text-gray-300">
      </div>

      <!-- Status -->
      <div>
        <label class="block mb-1 text-sm text-gray-400">Status</label>
        <select name="active"
                class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500">
          <option value="1" {% if loan.active %}selected{% endif %}>Active</option>
          <option value="0" {% if not loan.active %}selected{% endif %}>Inactive</option>
        </select>
      </div>

      <!-- ACTIONS -->
      <div class="flex justify-between items-center pt-4">
        <button type="submit"
                class="px-6 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg flex items-center gap-2">
          <i class="fa-solid fa-save"></i> Update Loan
        </button>

        <a href="{{ url_for('payroll_admin_bp.loan_payments', loan_id=loan.id) }}"
           class="px-4 py-2 bg-yellow-600 hover:bg-yellow-700 rounded-lg flex items-center gap-2">
          <i class="fa-solid fa-coins"></i> View Payments
        </a>
      </div>

    </form>
  </div>

</section>

<!-- ===== OPTIONAL JS (AUTO CALC PREVIEW) ===== -->
<script>
  const totalInput = document.getElementById("total_amount");
  const monthlyInput = document.getElementById("monthly_payment");

  totalInput.addEventListener("input", () => {
    if (monthlyInput.value) {
      let months = parseFloat(totalInput.value) / parseFloat(monthlyInput.value);
      console.log("Estimated months:", months.toFixed(1));
    }
  });
</script>

{% endblock %}
