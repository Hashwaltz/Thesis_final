{% extends 'payroll/admin/payroll_admin_base.html' %}
{% block title %}{{ action }} Loan{% endblock %}

{% block content %}

<section class="p-6 space-y-6 text-gray-200">

<!-- ===== HEADER ===== -->
<header class="flex justify-between items-center">

  <h1 class="text-2xl font-semibold text-emerald-400">
    {{ action }} Loan
  </h1>

  <a href="{{ url_for('payroll_admin_bp.loans') }}"
     class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition">
    Back to Loans
  </a>

</header>


<!-- ===== SWEETALERT ===== -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<script>
document.addEventListener("DOMContentLoaded", function(){
  {% for category, message in messages %}
  Swal.fire({
    icon: "{{ 'success' if category=='success' else 'error' }}",
    title: "{{ message }}",
    toast:true,
    position:'top-end',
    timer:2500,
    showConfirmButton:false
  });
  {% endfor %}
});
</script>
{% endif %}
{% endwith %}


<!-- ===== FORM ===== -->
<form method="POST"
class="bg-gray-800 p-6 rounded-2xl border border-gray-700 max-w-lg space-y-5">

<!-- Employee -->
<div>
  <label class="block mb-2 text-gray-300">Employee</label>

  <select name="employee_id"
          class="w-full px-4 py-2 rounded-lg bg-gray-900 border border-gray-600 focus:ring-2 focus:ring-emerald-600 outline-none"
          required>

    <option value="">Select Employee</option>

    {% for emp in employees %}
    <option value="{{ emp.id }}"
      {% if loan and loan.employee_id == emp.id %}selected{% endif %}>
      {{ emp.get_full_name() }}
    </option>
    {% endfor %}

  </select>
</div>


<!-- Provider -->
<div>
  <label class="block mb-2 text-gray-300">Loan Provider</label>

  <select name="provider"
          class="w-full px-4 py-2 rounded-lg bg-gray-900 border border-gray-600 focus:ring-2 focus:ring-emerald-600 outline-none"
          required>

    <option value="">Select Provider</option>

    <option value="Pag-IBIG"
      {% if loan and loan.provider == 'Pag-IBIG' %}selected{% endif %}>
      Pag-IBIG
    </option>

    <option value="SSS"
      {% if loan and loan.provider == 'SSS' %}selected{% endif %}>
      SSS
    </option>

     <option value="GSIS"
      {% if loan and loan.provider == 'GSIS' %}selected{% endif %}>
      GSIS
    </option>

    <option value="MENPC"
      {% if loan and loan.provider == 'MENPC' %}selected{% endif %}>
      MENPC
    </option>

  </select>
</div>


<!-- Loan Type -->
<div>
  <label class="block mb-2 text-gray-300">Loan Type</label>

  <select name="loan_type"
          class="w-full px-4 py-2 rounded-lg bg-gray-900 border border-gray-600 focus:ring-2 focus:ring-emerald-600 outline-none"
          required>

    <option value="">Select Type</option>

    <option value="MPL"
      {% if loan and loan.loan_type == 'MPL' %}selected{% endif %}>
      Multi-Purpose Loan (MPL)
    </option>

    <option value="Salary Loan"
      {% if loan and loan.loan_type == 'Salary Loan' %}selected{% endif %}>
      Salary Loan
    </option>

    <option value="Emergency Loan"
      {% if loan and loan.loan_type == 'Emergency Loan' %}selected{% endif %}>
      Emergency Loan
    </option>

    <option value="Personal Loan"
      {% if loan and loan.loan_type == 'Personal Loan' %}selected{% endif %}>
      Personal Loan
    </option>

  </select>
</div>


<!-- Total Amount -->
<div>
  <label class="block mb-2 text-gray-300">Total Amount</label>

  <input type="number" step="0.01"
         name="total_amount"
         value="{{ loan.total_amount if loan else '' }}"
         class="w-full px-4 py-2 rounded-lg bg-gray-900 border border-gray-600 focus:ring-2 focus:ring-emerald-600 outline-none"
         required>
</div>


<!-- Monthly Payment -->
<div>
  <label class="block mb-2 text-gray-300">Monthly Payment</label>

  <input type="number" step="0.01"
         name="monthly_payment"
         value="{{ loan.monthly_payment if loan else '' }}"
         class="w-full px-4 py-2 rounded-lg bg-gray-900 border border-gray-600 focus:ring-2 focus:ring-emerald-600 outline-none"
         required>
</div>


<!-- Start Date -->
<div>
  <label class="block mb-2 text-gray-300">Start Date</label>

  <input type="date"
         name="start_date"
         value="{{ loan.start_date if loan else '' }}"
         class="w-full px-4 py-2 rounded-lg bg-gray-900 border border-gray-600">
</div>


<!-- Active -->
<div class="flex items-center gap-2">
  <input type="checkbox"
         name="active"
         class="w-4 h-4 accent-emerald-500"
         {% if not loan or loan.active %}checked{% endif %}>

  <label class="text-gray-300">Active</label>
</div>


<!-- Submit -->
<button type="button"
        id="loanSubmitBtn"
        class="w-full px-4 py-2 bg-emerald-600 hover:bg-emerald-700 rounded-lg transition font-semibold">

  {{ action }}

</button>

</form>

</section>


<!-- ===== JS VALIDATION ===== -->
<script>

const form = document.querySelector("form");
const submitBtn = document.getElementById("loanSubmitBtn");

submitBtn.addEventListener("click", function(){

  const employee = form.employee_id.value;
  const provider = form.provider.value;
  const type = form.loan_type.value;

  if(!employee || !provider || !type){

    Swal.fire({
      icon:'warning',
      title:'Missing Required Fields',
      text:'Employee, provider, and loan type are required',
      confirmButtonColor:'#16a34a'
    });

    return;
  }

  Swal.fire({
    title:'Save Loan?',
    text:'Confirm loan details before saving',
    icon:'question',
    showCancelButton:true,
    confirmButtonColor:'#16a34a'
  }).then(result=>{
    if(result.isConfirmed){
      form.submit();
    }
  });

});

</script>

{% endblock %}
