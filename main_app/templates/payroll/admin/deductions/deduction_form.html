{% extends 'payroll/admin/payroll_admin_base.html' %}
{% block title %}{{ action }} Deduction{% endblock %}

{% block content %}

<section class="p-6 space-y-6 text-gray-200">

<header class="flex justify-between items-center">

<h1 class="text-2xl font-semibold text-emerald-400">
{{ action }} Deduction
</h1>

<a href="{{ url_for('payroll_admin_bp.deductions') }}"
class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition">
Back to Deductions
</a>

</header>


<!-- ================= FLASH MESSAGE SWEETALERT ================= -->

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<script>
document.addEventListener("DOMContentLoaded", function(){

{% for category, message in messages %}

Swal.fire({
icon: "{{ 'success' if category=='success' else 'error' }}",
title: "{{ message }}",
toast:true,
position:'top-end',
timer:2500,
showConfirmButton:false
});

{% endfor %}

});
</script>
{% endif %}
{% endwith %}


<!-- ================= FORM CARD ================= -->

<form method="POST"
class="bg-gray-800 p-6 rounded-2xl border border-gray-700 max-w-lg space-y-5">

<!-- Deduction Name -->
<div>
<label class="block mb-2 text-gray-300">Deduction Name</label>

<input type="text"
name="name"
value="{{ deduction.name if deduction else '' }}"
class="w-full px-4 py-2 rounded-lg bg-gray-900 border border-gray-600 focus:ring-2 focus:ring-emerald-600 outline-none"
required>
</div>


<!-- Calculation Type -->
<div>
<label class="block mb-2 text-gray-300">Calculation Type</label>

<select name="calculation_type"
class="w-full px-4 py-2 rounded-lg bg-gray-900 border border-gray-600 focus:ring-2 focus:ring-emerald-600 outline-none"
required>

<option value="">Select Type</option>

<option value="fixed"
{% if deduction and deduction.calculation_type=='fixed' %}selected{% endif %}>
Fixed
</option>

<option value="percentage"
{% if deduction and deduction.calculation_type=='percentage' %}selected{% endif %}>
Percentage
</option>

<option value="bracket"
{% if deduction and deduction.calculation_type=='bracket' %}selected{% endif %}>
Bracket
</option>

<option value="progressive"
{% if deduction and deduction.calculation_type=='progressive' %}selected{% endif %}>
Progressive
</option>

</select>
</div>


<!-- Maximum Salary -->
<div>
<label class="block mb-2 text-gray-300">Description</label>

<input type="text"
name="description"
value="{{ deduction.description if deduction else '' }}"
class="w-full px-4 py-2 rounded-lg bg-gray-900 border border-gray-600">
</div>


<!-- Active -->
<div class="flex items-center gap-2">
<input type="text"
name="active"
class="w-4 h-4 accent-emerald-500"
{% if not deduction or deduction.active %}checked{% endif %}>

<label class="text-gray-300">Active</label>
</div>


<!-- Submit Button -->
<button type="submit"
id="deductionSubmitBtn"
class="w-full px-4 py-2 bg-emerald-600 hover:bg-emerald-700 rounded-lg transition font-semibold">

{{ action }}

</button>

</form>

</section>


<!-- ================= JS VALIDATION + CONFIRMATION ================= -->

<script>

const form = document.querySelector("form");
const submitBtn = document.getElementById("deductionSubmitBtn");

submitBtn.addEventListener("click", function(){

const name = form.name.value.trim();
const calcType = form.calculation_type.value;

if(!name || !calcType){

Swal.fire({
icon:'warning',
title:'Missing Required Fields',
text:'Deduction name and calculation type are required',
confirmButtonColor:'#16a34a'
});

return;
}

Swal.fire({
title:'Save Deduction?',
text:'Please confirm deduction configuration',
icon:'question',
showCancelButton:true,
confirmButtonColor:'#16a34a'
}).then(result=>{
if(result.isConfirmed){
form.submit();
}
});

});

</script>

{% endblock %}
