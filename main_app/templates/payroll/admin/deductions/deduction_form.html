{% extends 'payroll/admin/payroll_admin_base.html' %}
{% block title %}{{ action }} Deduction | Payroll Admin{% endblock %}

{% block content %}

<section class="min-h-screen px-4 py-10 flex justify-center bg-gray-900 text-gray-100">

<div class="w-full max-w-2xl space-y-6">

<!-- HEADER -->
<header class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3">

<h1 class="text-2xl font-bold text-emerald-400 flex items-center gap-2">
<i class="fa-solid fa-hand-holding-dollar"></i>
{{ action }} Deduction
</h1>

<a href="{{ url_for('payroll_admin_bp.deductions') }}"
class="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded-xl transition flex items-center gap-2 w-fit">

<i class="fa-solid fa-arrow-left"></i>
Back

</a>

</header>


<!-- FLASH -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<script>
document.addEventListener("DOMContentLoaded", function(){
{% for category, message in messages %}
Swal.fire({
icon: "{{ 'success' if category=='success' else 'error' }}",
title: "{{ message }}",
toast: true,
position: 'top-end',
timer: 2500,
showConfirmButton: false
});
{% endfor %}
});
</script>
{% endif %}
{% endwith %}


<!-- FORM CARD -->
<form method="POST"
class="bg-gray-800/70 backdrop-blur-xl border border-gray-700
       p-6 sm:p-8 rounded-2xl shadow-xl space-y-6">

<!-- NAME -->
<div>
<label class="flex items-center gap-2 text-gray-300 mb-2">
<i class="fa-solid fa-tag text-emerald-400"></i>
Deduction Name
</label>

<input type="text"
name="name"
value="{{ deduction.name if deduction else '' }}"
placeholder="e.g. Tax, SSS, PhilHealth"
class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-600
       focus:ring-2 focus:ring-emerald-500 outline-none transition"
required>
</div>


<!-- TYPE -->
<div>
<label class="flex items-center gap-2 text-gray-300 mb-2">
<i class="fa-solid fa-calculator text-emerald-400"></i>
Calculation Type
</label>

<select name="calculation_type"
class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-600
       focus:ring-2 focus:ring-emerald-500 outline-none transition"
required>

<option value="">Select Type</option>

<option value="fixed"
{% if deduction and deduction.calculation_type=='fixed' %}selected{% endif %}>
Fixed
</option>

<option value="percentage"
{% if deduction and deduction.calculation_type=='percentage' %}selected{% endif %}>
Percentage
</option>

<option value="bracket"
{% if deduction and deduction.calculation_type=='bracket' %}selected{% endif %}>
Bracket
</option>

<option value="progressive"
{% if deduction and deduction.calculation_type=='progressive' %}selected{% endif %}>
Progressive
</option>

</select>
</div>


<!-- DESCRIPTION -->
<div>
<label class="flex items-center gap-2 text-gray-300 mb-2">
<i class="fa-solid fa-align-left text-emerald-400"></i>
Description
</label>

<input type="text"
name="description"
value="{{ deduction.description if deduction else '' }}"
placeholder="Optional description"
class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-600
       focus:ring-2 focus:ring-emerald-500 outline-none transition">
</div>


<!-- ACTIVE -->
<div class="flex items-center gap-3 p-4 bg-gray-900 rounded-xl border border-gray-700">

<input type="checkbox"
name="active"
class="w-5 h-5 accent-emerald-500"
{% if not deduction or deduction.active %}checked{% endif %}>

<label class="flex items-center gap-2 text-gray-300">
<i class="fa-solid fa-toggle-on text-emerald-400"></i>
Active Status
</label>

</div>


<!-- SUBMIT -->
<button type="submit"
id="deductionSubmitBtn"
class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500
       text-white font-semibold transition shadow-lg flex items-center justify-center gap-2">

<i class="fa-solid fa-floppy-disk"></i>
{{ action }}

</button>

</form>

</div>

</section>


<!-- JS CONFIRMATION -->
<script>
const form = document.querySelector("form");
const submitBtn = document.getElementById("deductionSubmitBtn");

submitBtn.addEventListener("click", function (e) {
e.preventDefault();

const name = form.name.value.trim();
const calcType = form.calculation_type.value;

if (!name || !calcType) {
Swal.fire({
icon: 'warning',
title: 'Missing Fields',
text: 'Deduction name and calculation type are required',
confirmButtonColor: '#10b981'
});
return;
}

Swal.fire({
title: 'Save Deduction?',
text: 'Please confirm saving this deduction configuration',
icon: 'question',
showCancelButton: true,
confirmButtonColor: '#10b981'
}).then(result => {
if (result.isConfirmed) {
form.submit();
}
});

});
</script>

{% endblock %}
